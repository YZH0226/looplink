<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>循链 LoopLink · 平台总览</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0f8b6c">
</head>
<body data-page="overview">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <nav class="mnav" id="mnav"></nav>
    <div class="content">
      <!-- ============ OVERVIEW ============ -->
      <section class="view active" id="view-overview">
        <div class="grid g4" id="kpi-grid" style="margin-bottom:14px"></div>

        <div class="grid g-2-1" style="margin-bottom:14px">
          <div class="card">
            <div class="card-head">
              <div class="card-title"><span class="bar"></span>区域供需缺口 · 按省份</div>
              <span class="card-sub">单位：吨/月</span>
            </div>
            <div class="bar-legend">
              <span class="lg"><i style="background:#8d99ae"></i>本省废物产出量</span>
              <span class="lg"><i style="background:#12a37e"></i>本省加工余量</span>
              <span class="lg" style="margin-left:auto;color:#a7b6b0">缺口 = 产出量 − 加工余量</span>
            </div>
            <div class="card-body" id="chart-region" style="padding-top:8px"></div>
          </div>

          <div class="card">
            <div class="card-head">
              <div class="card-title"><span class="bar"></span>跨省流向 TOP</div>
              <span class="card-sub" id="flow-sub"></span>
            </div>
            <div class="card-body" style="padding-top:6px" id="flow-panel"></div>
          </div>
        </div>

        <div class="grid g2">
          <div class="card">
            <div class="card-head">
              <div class="card-title"><span class="bar"></span>加工厂产能利用率 TOP</div>
              <span class="card-sub">撮合后口径</span>
            </div>
            <div class="card-body" id="chart-util" style="padding-top:8px"></div>
          </div>
          <div class="card">
            <div class="card-head">
              <div class="card-title"><span class="bar"></span>链路缺口诊断</div>
              <span class="card-sub">撮合后自动生成</span>
            </div>
            <div class="card-body" id="gap-panel"></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<div id="toast"></div>
<div class="loading-ov" id="loading">
  <div>
    <div class="spinner" style="margin:0 auto"></div>
    <div class="loading-txt" id="loading-txt">正在构建撮合链路…</div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
