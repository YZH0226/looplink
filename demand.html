<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>循链 LoopLink · 需求方·产品需求</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0f8b6c">
</head>
<body data-page="demand">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <nav class="mnav" id="mnav"></nav>
    <div class="content">
      <!-- ============ DEMAND ============ -->
      <section class="view active" id="view-demand">
        <div class="grid g-2-1" style="margin-bottom:14px">
          <div class="card">
            <div class="card-head">
              <div class="card-title"><span class="bar"></span>需求方产品需求登记</div>
              <span class="card-sub">需求产品需与加工厂产出物同名才能匹配</span>
            </div>
            <div class="card-body">
              <form id="form-demand" class="form-grid">
                <div class="field full">
                  <label>企业名称<span>*</span></label>
                  <input name="company" required placeholder="如：江西晨鸣纸业">
                </div>
                <div class="field">
                  <label>需求产品类型<span>*</span></label>
                  <input name="type" list="product-list" required placeholder="如：再生纸浆">
                  <datalist id="product-list"></datalist>
                </div>
                <div class="field">
                  <label>月需求量（吨）<span>*</span></label>
                  <input name="qty" type="number" min="1" required placeholder="如：500">
                </div>
                <div class="field">
                  <label>可接受单价（元/吨）</label>
                  <input name="price" type="number" min="0" step="10" placeholder="如：2400">
                </div>
                <div class="field">
                  <label>所在省份<span>*</span></label>
                  <select name="province" class="sel-province" required></select>
                </div>
                <div class="field">
                  <label>所在城市<span>*</span></label>
                  <input name="city" required placeholder="如：广州">
                  <span class="hint">全国范围撮合，跨省需求也可接入</span>
                </div>
                <div class="field full" style="flex-direction:row;justify-content:flex-end">
                  <button type="submit" class="btn btn-primary">
                    <svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                    提交登记
                  </button>
                </div>
              </form>
              <div class="tip">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8.2v.2"/><path d="M12 11v5"/></svg>
                <div>需求产品请填写加工厂的<b>产出物名称</b>，输入框会自动提示平台已有的再生品品类，可直接点选。</div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <div class="card-title"><span class="bar"></span>需求满足度</div>
            </div>
            <div class="card-body" id="demand-structure" style="padding-top:10px"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title"><span class="bar"></span>已登记产品需求</div>
            <span class="card-sub" id="demand-count"></span>
          </div>
          <div class="tbl-wrap">
            <table>
              <thead><tr>
                <th>企业名称</th><th>需求产品</th><th>月需求量</th><th>可接受单价</th>
                <th>省份 / 城市</th><th>撮合后满足率</th><th>现货来源</th><th style="text-align:right">操作</th>
              </tr></thead>
              <tbody id="tbody-demand"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<div id="toast"></div>
<div class="loading-ov" id="loading">
  <div>
    <div class="spinner" style="margin:0 auto"></div>
    <div class="loading-txt" id="loading-txt">正在构建撮合链路…</div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
